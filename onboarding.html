<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content:">
    <title>ImmoTrust Elite - Configuration</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#0d1c32",
                        "secondary": "#775a19",
                        "secondary-fixed": "#ffdea5",
                        "surface": "#f9f9fb",
                    },
                    "fontFamily": { "headline": ["Manrope"], "body": ["Inter"] }
                },
            },
        }
    </script>
    <style>
        .navy-gradient { background: linear-gradient(135deg, #0d1c32 0%, #1a2a44 100%); }
        .input-elite { background: #ffffff; border: 1px solid #e2e2e4; transition: all 0.3s ease; }
        .input-elite:focus { border-color: #0d1c32; box-shadow: 0 0 0 4px rgba(13, 28, 50, 0.05); outline: none; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col items-center">

<main class="relative z-10 w-full max-w-[430px] min-h-screen flex flex-col px-8 py-12">
    
    <div class="w-full h-1 bg-gray-200 rounded-full mb-12 overflow-hidden">
        <div id="progress-bar" class="w-2/3 h-full navy-gradient transition-all duration-700"></div>
    </div>

    <header class="text-center mb-10">
        <h1 class="font-headline text-3xl font-extrabold text-primary-container mb-3">Bienvenue 👋</h1>
        <p class="text-gray-500 text-sm">Configurons votre espace de gestion en quelques secondes.</p>
    </header>

    <form id="onboarding-form" class="flex flex-col gap-6">
        <div class="flex flex-col gap-2">
            <label class="text-[11px] uppercase tracking-wider font-bold text-primary-container/70 ml-1">Numéro WhatsApp</label>
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sm font-bold text-gray-400">+242</span>
                <input type="tel" id="whatsapp" required placeholder="06 000 00 00" class="input-elite w-full py-4 pl-14 pr-4 rounded-xl text-sm font-medium">
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <label class="text-[11px] uppercase tracking-wider font-bold text-primary-container/70 ml-1">Ville</label>
            <select id="city" class="input-elite w-full py-4 px-4 rounded-xl text-sm font-medium appearance-none">
                <option value="Brazzaville">Brazzaville</option>
                <option value="Pointe-Noire">Pointe-Noire</option>
                <option value="Autre">Autre ville</option>
            </select>
        </div>

        <div class="flex flex-col gap-2">
            <label class="text-[11px] uppercase tracking-wider font-bold text-primary-container/70 ml-1">Combien de biens gérez-vous ?</label>
            <div class="grid grid-cols-3 gap-3">
                <label class="cursor-pointer">
                    <input type="radio" name="size" value="1-5" class="hidden peer" checked>
                    <div class="peer-checked:bg-primary-container peer-checked:text-white border border-gray-200 rounded-xl p-3 text-center text-xs font-bold transition-all">1 - 5</div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="size" value="5-20" class="hidden peer">
                    <div class="peer-checked:bg-primary-container peer-checked:text-white border border-gray-200 rounded-xl p-3 text-center text-xs font-bold transition-all">5 - 20</div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="size" value="20+" class="hidden peer">
                    <div class="peer-checked:bg-primary-container peer-checked:text-white border border-gray-200 rounded-xl p-3 text-center text-xs font-bold transition-all">20+</div>
                </label>
            </div>
        </div>

        <button type="submit" id="submit-btn" class="navy-gradient w-full py-5 mt-6 rounded-xl flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-all group">
            <span class="font-label uppercase tracking-[0.15em] font-bold text-secondary-fixed text-sm">Finaliser mon profil</span>
            <span class="material-symbols-outlined text-secondary-fixed text-lg">check_circle</span>
        </button>
    </form>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyARvYr3Q9J58X9eyY8lo7CYbdGuJo_A6iU",
        authDomain: "immotrust-ed194.firebaseapp.com",
        databaseURL: "https://immotrust-ed194-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "immotrust-ed194",
        storageBucket: "immotrust-ed194.firebasestorage.app",
        messagingSenderId: "6876164261",
        appId: "1:6876164261:web:030cc1f107629d82675d4c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;

    // Vérifier si l'utilisateur est bien connecté
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
        } else {
            // Si pas connecté, retour à la page auth
            window.location.href = 'auth.html';
        }
    });

    const form = document.getElementById('onboarding-form');
    form.onsubmit = async (e) => {
        e.preventDefault();
        
        if (!currentUser) return;

        const whatsapp = document.getElementById('whatsapp').value;
        const city = document.getElementById('city').value;
        const size = document.querySelector('input[name="size"]:checked').value;

        try {
            // On met à jour le profil existant dans Realtime Database
            await update(ref(db, 'users/' + currentUser.uid), {
                whatsapp: "+242" + whatsapp,
                city: city,
                propertyCount: size,
                onboardingComplete: true
            });

            // Une fois fini, direction le dashboard
            document.getElementById('progress-bar').style.width = '100%';
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 500);

        } catch (error) {
            alert("Erreur lors de l'enregistrement : " + error.message);
        }
    };
</script>
<script src="cordova.js"></script>
</body>
</html>
